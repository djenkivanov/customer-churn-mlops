name: CI linting and testing

on:
  push:
    branches: [dev]
    paths:
      - "pipelines/full_pipeline.py"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [dev]
    paths:
      - "pipelines/full_pipeline.py"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

jobs:
  lint_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check pipeline/full_pipeline.py
      - name: Black check
        run: black --check pipeline/full_pipeline.py